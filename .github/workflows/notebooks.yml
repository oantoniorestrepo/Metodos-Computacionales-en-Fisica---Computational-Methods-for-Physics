name: Ejecutar notebooks

# Se dispara en cada push y en cada pull request a main.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # permite lanzarlo manualmente desde la pestaña Actions

jobs:
  run-notebooks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # que un notebook falle no cancela los demás
      matrix:
        notebook:
          # --- ES ---
          - ES/Clases_1_2_3_Introduccion_y_Preliminares.ipynb
          - ES/Clase_04_Representacion_Binaria.ipynb
          - ES/Clase_05_Teoria_de_Errores.ipynb
          - ES/Clase_06_Estabilidad_Numerica.ipynb
          - ES/Clases_7_8_9_Raices.ipynb
          - ES/Clases_10_11_12_Interpolacion.ipynb
          - ES/Clase_13_Diferenciacion.ipynb
          - ES/Clases_14_15_16_Integrales_Numericas.ipynb
          - ES/Clases_17_18_Algebra_Lineal.ipynb
          - ES/Clases_19_20_Matrices.ipynb
          - ES/Clases_24_25_26_Estadistica_y_Monte_Carlo.ipynb
          # --- EN ---
          - EN/Classes_1_2_3_Introduction_and_Preliminaries.ipynb
          - EN/Class_04_Binary_Representation.ipynb
          - EN/Class_05_Error_Theory.ipynb
          - EN/Class_06_Numerical_Stability.ipynb
          - EN/Classes_7_8_9_Roots.ipynb
          - EN/Classes_10_11_12_Interpolation.ipynb
          - EN/Class_13_Differentiation.ipynb
          - EN/Classes_14_15_16_Numerical_Integration.ipynb
          - EN/Classes_17_18_Linear_Algebra.ipynb
          - EN/Classes_19_20_Matrices.ipynb
          - EN/Classes_24_25_26_Statistics_and_Monte_Carlo.ipynb
          # NOTA: Clases 21-23 (EDO) quedan fuera de esta lista a propósito.
          # Ese notebook usa animaciones con backend Qt5Agg pensadas para
          # verse en una sesión local de Jupyter; no tiene sentido "aprobar"
          # su ejecución en un entorno headless sin pantalla. Se valida
          # aparte en el job run-edo-headless de abajo (solo que no truene,
          # sin esperar ver la animación).

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbconvert ipykernel \
                      numpy scipy matplotlib sympy numba

      - name: Ejecutar ${{ matrix.notebook }}
        env:
          MPLBACKEND: Agg   # backend sin pantalla, para que matplotlib no falle
        run: |
          jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=1200 \
            --output /tmp/out.ipynb \
            "${{ matrix.notebook }}"

  run-edo-headless:
    # Caso especial: Clases 21-23 (EDO). Se ejecuta igual para detectar
    # errores de código, pero las celdas de animación (que abren una
    # ventana Qt5) no van a mostrar nada en este entorno -- eso es
    # esperado. Para ver las animaciones hay que descargar el notebook
    # y correrlo en Jupyter localmente.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        notebook:
          - ES/Clases_21_22_23_Metodos_de_integracion_EDO.ipynb
          - EN/Classes_21_22_23_ODE_Integration_Methods.ipynb
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbconvert ipykernel numpy scipy matplotlib sympy

      - name: Ejecutar ${{ matrix.notebook }} (sin verificar animaciones)
        env:
          MPLBACKEND: Agg
        run: |
          jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=1200 \
            --output /tmp/out.ipynb \
            "${{ matrix.notebook }}"
